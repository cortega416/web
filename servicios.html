<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - Streaming Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (mismo código) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🎬 Streaming Manager</h1>
                <div class="user-info">
                    <span id="userDisplay"></span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="servicios.html" class="nav-item active">
                    <span class="icon">🎯</span>
                    <span>Servicios</span>
                </a>
                <a href="clientes.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Clientes</span>
                </a>
                <a href="correos.html" class="nav-item" id="navCorreos">
                    <span class="icon">📧</span>
                    <span>Correos</span>
                </a>
                <a href="cuentas.html" class="nav-item">
                    <span class="icon">🔐</span>
                    <span>Cuentas</span>
                </a>
                <a href="movimientos.html" class="nav-item">
                    <span class="icon">💰</span>
                    <span>Movimientos</span>
                </a>
                <a href="alertas.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>Alertas</span>
                    <span class="badge" id="alertBadge"></span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="btn btn-secondary btn-block" onclick="Auth.logout()">
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <button class="mobile-menu-toggle" onclick="toggleMobileSidebar()">☰</button>
                <h2>Servicios</h2>
                <div class="topbar-actions">
                    <button class="btn btn-primary" id="btnNuevoServicio" style="display: none;">
                        ➕ Nuevo Servicio
                    </button>
                </div>
            </div>

            <div class="content">
                <!-- Filters -->
                <div class="filters">
                    <div class="filter-group">
                        <input type="text" id="searchServicio" placeholder="🔍 Buscar servicio..." class="form-control">
                    </div>
                    <div class="filter-group">
                        <select id="filterTipo" class="form-control">
                            <option value="">Todos los tipos</option>
                            <option value="streaming">Streaming</option>
                            <option value="vpn">VPN</option>
                            <option value="software">Software</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="filterEstado" class="form-control">
                            <option value="activo">Activos</option>
                            <option value="inactivo">Inactivos</option>
                            <option value="">Todos</option>
                        </select>
                    </div>
                </div>

                <!-- Servicios Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-container">
                            <table id="serviciosTable">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Tipo</th>
                                        <th>Precio Venta</th>
                                        <th>Duración</th>
                                        <th>Perfiles Máx</th>
                                        <th id="thCostoBase" style="display: none;">Costo Base</th>
                                        <th>Estado</th>
                                        <th id="thAcciones" style="display: none;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Se carga dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Crear/Editar Servicio -->
    <div class="modal-overlay" id="modalServicio">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalServicioTitle">Nuevo Servicio</h3>
                <button class="modal-close" onclick="closeModalServicio()">✕</button>
            </div>
            <div class="modal-body">
                <form id="formServicio">
                    <input type="hidden" id="servicioId">
                    
                    <div class="form-grid">
                        <div class="form-group required">
                            <label for="servicioNombre">Nombre</label>
                            <input type="text" id="servicioNombre" required>
                        </div>
                        
                        <div class="form-group required">
                            <label for="servicioTipo">Tipo</label>
                            <select id="servicioTipo" required>
                                <option value="">Seleccionar...</option>
                                <option value="streaming">Streaming</option>
                                <option value="vpn">VPN</option>
                                <option value="software">Software</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group required">
                            <label for="servicioPrecioVenta">Precio Venta</label>
                            <input type="number" id="servicioPrecioVenta" step="0.01" min="0" required>
                        </div>
                        
                        <div class="form-group required">
                            <label for="servicioCostoBase">Costo Base</label>
                            <input type="number" id="servicioCostoBase" step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group required">
                            <label for="servicioDuracion">Duración (días)</label>
                            <input type="number" id="servicioDuracion" min="1" required>
                            <small>Duración de la suscripción en días</small>
                        </div>
                        
                        <div class="form-group required">
                            <label for="servicioPerfilesMax">Perfiles Máximos</label>
                            <input type="number" id="servicioPerfilesMax" min="1" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="servicioVisiblePara">Visible Para</label>
                        <select id="servicioVisiblePara">
                            <option value="todos">Todos</option>
                            <option value="admin">Solo Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="servicioNotas">Notas</label>
                        <textarea id="servicioNotas"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModalServicio()">Cancelar</button>
                <button class="btn btn-primary" onclick="guardarServicio()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sheetsClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/servicios.js"></script>
    <script src="js/mobile.js"></script>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
</body>
</html>
