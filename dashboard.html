<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Streaming Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🎬 Streaming Manager</h1>
                <div class="user-info">
                    <span id="userDisplay"></span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="servicios.html" class="nav-item">
                    <span class="icon">🎯</span>
                    <span>Servicios</span>
                </a>
                <a href="clientes.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Clientes</span>
                </a>
                <a href="correos.html" class="nav-item" id="navCorreos">
                    <span class="icon">📧</span>
                    <span>Correos</span>
                </a>
                <a href="cuentas.html" class="nav-item">
                    <span class="icon">🔐</span>
                    <span>Cuentas</span>
                </a>
                <a href="movimientos.html" class="nav-item">
                    <span class="icon">💰</span>
                    <span>Movimientos</span>
                </a>
                <a href="alertas.html" class="nav-item">
                    <span class="icon">⚠️</span>
                    <span>Alertas</span>
                    <span class="badge" id="alertBadge"></span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="btn btn-secondary btn-block" onclick="Auth.logout()">
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <h2>Dashboard</h2>
                <div class="topbar-actions">
                    <button class="btn btn-primary" onclick="location.reload()">
                        🔄 Refrescar
                    </button>
                </div>
            </div>

            <div class="content">
                <!-- Stats Grid -->
                <div class="stats-grid" id="statsGrid">
                    <!-- Stats se cargan dinámicamente -->
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <h3>Actividad Reciente</h3>
                        <a href="movimientos.html" class="btn btn-sm btn-secondary">Ver Todo</a>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table id="recentActivityTable">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Tipo</th>
                                        <th>Cliente</th>
                                        <th>Servicio</th>
                                        <th>Monto</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Se carga dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Alertas Próximas -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h3>⚠️ Alertas Próximas</h3>
                        <a href="alertas.html" class="btn btn-sm btn-warning">Ver Todas</a>
                    </div>
                    <div class="card-body">
                        <div id="alertasPreview">
                            <!-- Se carga dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sheetsClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
