<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>  - Streaming Manager</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-film"></i> Streaming Manager</h1>
                <div class="user-info">
                    <span id="userDisplay"></span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="https://hansweb.me/" class="nav-item">
                    <span class="icon"><i class="fas fa-globe"></i></span>
                    <span>HANS WEB</span>
                </a>
                <a href="dashboard.html" class="nav-item active">
                    <span class="icon"><i class="fas fa-chart-bar"></i></span>
                    <span>Dashboard</span>
                </a>
                <a href="servicios.html" class="nav-item">
                    <span class="icon"><i class="fas fa-tv"></i></span>
                    <span>Servicios</span>
                </a>
                <a href="clientes.html" class="nav-item">
                    <span class="icon"><i class="fas fa-users"></i></span>
                    <span>Clientes</span>
                </a>
                <a href="correos.html" class="nav-item" id="navCorreos">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <span>Correos</span>
                </a>
                <a href="cuentas.html" class="nav-item">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <span>Cuentas</span>
                </a>
                <a href="movimientos.html" class="nav-item">
                     <span class="icon"><i class="fas fa-money-bill-wave"></i></span>
                    <span>Movimientos</span>
                </a>
                <a href="alertas.html" class="nav-item">
                    <span class="icon"><i class="fas fa-bell"></i></span>
                    <span>Alertas</span>
                    <span class="badge" id="alertBadge"></span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="btn btn-secondary btn-block" onclick="Auth.logout()">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <button class="mobile-menu-toggle" onclick="toggleMobileSidebar()"><i class="fas fa-bars"></i></button>
                <h2><i class="fas fa-chart-bar"></i> Dashboard</h2>
                <div class="topbar-actions">
                    <button class="btn btn-primary btn-sm" onclick="location.reload()">
                        <i class="fas fa-sync-alt"></i> <span class="hide-mobile">Refrescar</span>
                    </button>
                </div>
            </div>

            <div class="content">
                <!-- Stats -->
                <div class="stats-grid" id="statsGrid"></div>

                <!-- Period selector for charts -->
                <div class="filters" style="margin-bottom: 16px;">
                    <div class="filter-group">
                        <label style="font-weight:600; font-size:13px; margin-bottom:6px; display:block;">Período del gráfico</label>
                        <select id="chartPeriodo" class="form-control" onchange="updateCharts()">
                            <option value="7">Últimos 7 días</option>
                            <option value="30" selected>Últimos 30 días</option>
                            <option value="60">Últimos 60 días</option>
                            <option value="90">Últimos 90 días</option>
                        </select>
                    </div>
                </div>

                <!-- Charts Row 1 -->
                <div class="charts-grid">
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-chart-line"></i> Ingresos vs Gastos</h3>
                        </div>
                        <div class="card-body">
                            <canvas id="chartIngresos" height="80"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-layer-group"></i> Distribución de Servicios</h3>
                        </div>
                        <div class="card-body">
                            <canvas id="chartServicios" height="80"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Charts Row 2 -->
                <div class="charts-grid">
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-th-large"></i> Ocupación por Servicio</h3>
                        </div>
                        <div class="card-body">
                            <canvas id="chartOcupacion" height="80"></canvas>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-trophy"></i> Top Servicios por Ingresos</h3>
                        </div>
                        <div class="card-body">
                            <canvas id="chartTopServicios" height="80"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-clock"></i> Actividad Reciente</h3>
                        <a href="movimientos.html" class="btn btn-sm btn-secondary">Ver Todo</a>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table id="recentActivityTable">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Tipo</th>
                                        <th>Cliente</th>
                                        <th class="hide-mobile">Servicio</th>
                                        <th>Monto</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Alertas -->
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-bell"></i> Alertas Próximas</h3>
                        <a href="alertas.html" class="btn btn-sm btn-warning">Ver Todas</a>
                    </div>
                    <div class="card-body">
                        <div id="alertasPreview"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/cache-manager.js"></script>
    <script src="js/sheetsClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/export.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
